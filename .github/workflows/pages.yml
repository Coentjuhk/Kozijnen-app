name: Publiceer op GitHub Pages

on:
  push:
    branches:
      - main
      - claude/kozijnen-app-from-financials-8fwiwr
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages accepteert alleen een deploy vanaf de default branch. Beide
    # branches krijgen dezelfde commit, dus de andere slaan we over in
    # plaats van hem te laten falen. Werkt ook als de default verandert.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement zet Pages zelf aan, zodat dit niet handmatig hoeft.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Zet de app-bestanden klaar
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'README.md' \
            ./ _site/
          ls -la _site

      - uses: actions/upload-pages-artifact@v3

      - id: deployment
        uses: actions/deploy-pages@v4
